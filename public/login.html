<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | DocToken</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.06), transparent 35%),
                  radial-gradient(circle at bottom left, rgba(99, 102, 241, 0.06), transparent 35%),
                  #030712;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    input {
      background: rgba(255, 255, 255, 0.03) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      transition: all 0.2s ease-in-out;
    }
    input:focus {
      border-color: #34d399 !important;
      box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.15) !important;
      outline: none;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Main panel -->
  <div class="max-w-md w-full glass-card p-8 rounded-3xl shadow-2xl relative overflow-hidden">
    <!-- Back to Home -->
    <a href="/index.html" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-white transition-colors mb-6 group">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5 group-hover:-translate-x-0.5 transition-transform"></i> Back to Home
    </a>

    <!-- Header -->
    <div class="mb-8">
      <h2 class="text-2xl font-bold tracking-tight text-white mb-2">Welcome Back</h2>
      <p class="text-sm text-slate-400">Sign in to access your appointment dashboard.</p>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-5">
      <!-- Email Address -->
      <div>
        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
            <i data-lucide="mail" class="w-4 h-4"></i>
          </span>
          <input type="email" id="email" placeholder="john@example.com" required
            class="w-full pl-10 pr-4 py-3 rounded-xl text-sm text-slate-100 bg-slate-900 border-slate-800">
        </div>
      </div>

      <!-- Password -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
          <a href="/forgot-password.html" class="text-xs text-emerald-400 hover:text-emerald-300 font-semibold transition-colors">Forgot Password?</a>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input type="password" id="password" placeholder="••••••••" required
            class="w-full pl-10 pr-4 py-3 rounded-xl text-sm text-slate-100 bg-slate-900 border-slate-800">
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submit-btn" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:brightness-110 text-slate-950 font-bold rounded-xl transition-all duration-300 flex items-center justify-center gap-2">
        <span>Sign In</span>
        <i data-lucide="log-in" class="w-4 h-4"></i>
      </button>
    </form>

    <!-- Footer Redirect -->
    <div class="mt-8 text-center text-sm text-slate-400">
      New to DocToken? <a href="/signup.html" class="text-emerald-400 hover:text-emerald-300 font-semibold transition-colors">Create Account</a>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full"></div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Check if user is already logged in
    const cachedToken = localStorage.getItem('token');
    const cachedUser = localStorage.getItem('user');
    if (cachedToken && cachedUser) {
      try {
        const u = JSON.parse(cachedUser);
        if (u.role === 'admin') window.location.href = '/admin-dashboard.html';
        else if (u.role === 'doctor') window.location.href = '/doctor-dashboard.html';
        else window.location.href = '/dashboard.html';
      } catch(e) {}
    }

    // Toast Utility
    function showToast(message, type = 'error') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-emerald-950/90 border-emerald-500' : 'bg-rose-950/90 border-rose-500';
      const textColor = type === 'success' ? 'text-emerald-400' : 'text-rose-400';
      const icon = type === 'success' ? 'check-circle' : 'alert-circle';
      
      toast.className = `p-4 rounded-xl border glass-card backdrop-blur-md flex items-start gap-3 shadow-lg transform translate-y-2 opacity-0 transition-all duration-300 ${bgColor}`;
      toast.innerHTML = `
        <div class="${textColor} mt-0.5">
          <i data-lucide="${icon}" class="w-5 h-5"></i>
        </div>
        <div class="text-sm font-semibold text-slate-200">${message}</div>
      `;
      
      container.appendChild(toast);
      lucide.createIcons();
      
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);
      
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Form Submit Handler
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');

      // Show loading status
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-slate-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Signing In...</span>
      `;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password }),
        });

        const result = await response.json();

        if (response.ok && result.success) {
          showToast('Sign in successful!', 'success');
          
          // Save credentials
          localStorage.setItem('token', result.token);
          localStorage.setItem('user', JSON.stringify(result.user));

          // Redirect based on role
          setTimeout(() => {
            if (result.user.role === 'admin') {
              window.location.href = '/admin-dashboard.html';
            } else if (result.user.role === 'doctor') {
              window.location.href = '/doctor-dashboard.html';
            } else {
              window.location.href = '/dashboard.html';
            }
          }, 1000);
        } else {
          // Handle unverified emails
          if (result.isNotVerified) {
            showToast(result.message + ' Redirecting to verify...', 'error');
            setTimeout(() => {
              window.location.href = `/verify-otp.html?email=${encodeURIComponent(email)}`;
            }, 2000);
          } else {
            showToast(result.message || 'Login failed');
            submitBtn.disabled = false;
            submitBtn.innerHTML = `
              <span>Sign In</span>
              <i data-lucide="log-in" class="w-4 h-4"></i>
            `;
            lucide.createIcons();
          }
        }
      } catch (err) {
        console.error('Login error:', err);
        showToast('Server connection error. Please try again.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <span>Sign In</span>
          <i data-lucide="log-in" class="w-4 h-4"></i>
        `;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
