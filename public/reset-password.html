<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | DocToken</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.06), transparent 35%),
                  radial-gradient(circle at bottom left, rgba(99, 102, 241, 0.06), transparent 35%),
                  #030712;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    input {
      background: rgba(255, 255, 255, 0.03) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      transition: all 0.2s ease-in-out;
    }
    input:focus {
      border-color: #34d399 !important;
      box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.15) !important;
      outline: none;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Main panel -->
  <div class="max-w-md w-full glass-card p-8 rounded-3xl shadow-2xl relative overflow-hidden">
    <!-- Back to Login -->
    <a href="/login.html" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-white transition-colors mb-6 group">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5 group-hover:-translate-x-0.5 transition-transform"></i> Cancel
    </a>

    <!-- Header -->
    <div class="mb-8">
      <h2 class="text-2xl font-bold tracking-tight text-white mb-2 font-extrabold">Set New Password</h2>
      <p class="text-sm text-slate-400">Complete the fields below to verify and finalize your password change for:</p>
      <p id="target-email" class="text-sm text-emerald-400 font-semibold mt-1">loading...</p>
    </div>

    <!-- Form -->
    <form id="reset-form" class="space-y-5">
      <!-- OTP Code -->
      <div>
        <label for="otp" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">6-Digit OTP Code</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
            <i data-lucide="shield-alert" class="w-4 h-4"></i>
          </span>
          <input type="text" id="otp" placeholder="123456" maxlength="6" required
            class="w-full pl-10 pr-4 py-3 rounded-xl text-sm text-slate-100 bg-slate-900 border-slate-800 tracking-widest font-bold text-center">
        </div>
      </div>

      <!-- New Password -->
      <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">New Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input type="password" id="password" placeholder="••••••••" required
            class="w-full pl-10 pr-4 py-3 rounded-xl text-sm text-slate-100 bg-slate-900 border-slate-800">
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submit-btn" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:brightness-110 text-slate-950 font-bold rounded-xl transition-all duration-300 flex items-center justify-center gap-2">
        <span>Change Password</span>
        <i data-lucide="check" class="w-4 h-4"></i>
      </button>
    </form>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full"></div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Get email from URL params
    const urlParams = new URLSearchParams(window.location.search);
    const emailParam = urlParams.get('email');

    if (!emailParam) {
      document.getElementById('target-email').innerText = 'No email supplied. Redirecting...';
      setTimeout(() => window.location.href = '/forgot-password.html', 2000);
    } else {
      document.getElementById('target-email').innerText = emailParam;
    }

    // Toast Utility
    function showToast(message, type = 'error') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-emerald-950/90 border-emerald-500' : 'bg-rose-950/90 border-rose-500';
      const textColor = type === 'success' ? 'text-emerald-400' : 'text-rose-400';
      const icon = type === 'success' ? 'check-circle' : 'alert-circle';
      
      toast.className = `p-4 rounded-xl border glass-card backdrop-blur-md flex items-start gap-3 shadow-lg transform translate-y-2 opacity-0 transition-all duration-300 ${bgColor}`;
      toast.innerHTML = `
        <div class="${textColor} mt-0.5">
          <i data-lucide="${icon}" class="w-5 h-5"></i>
        </div>
        <div class="text-sm font-semibold text-slate-200">${message}</div>
      `;
      
      container.appendChild(toast);
      lucide.createIcons();
      
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);
      
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Submit Handler
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const otp = document.getElementById('otp').value.trim();
      const newPassword = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');

      if (otp.length !== 6 || !/^\d+$/.test(otp)) {
        showToast('Please enter a valid 6-digit OTP');
        return;
      }
      if (newPassword.length < 6) {
        showToast('Password must be at least 6 characters long');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-slate-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Resetting...</span>
      `;

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email: emailParam, otp_code: otp, newPassword }),
        });

        const result = await response.json();

        if (response.ok && result.success) {
          showToast(result.message, 'success');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        } else {
          showToast(result.message || 'Password reset failed');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `
            <span>Change Password</span>
            <i data-lucide="check" class="w-4 h-4"></i>
          `;
          lucide.createIcons();
        }
      } catch (err) {
        console.error('Reset error:', err);
        showToast('Server connection error. Please try again.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <span>Change Password</span>
          <i data-lucide="check" class="w-4 h-4"></i>
        `;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
